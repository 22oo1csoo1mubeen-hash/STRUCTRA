[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structra-backend"
version = "0.1.0"
description = "Backend foundation for Structra."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "google-genai>=1.0,<2.0",
    "groq>=0.9.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.2,<4.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
